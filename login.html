<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Partenaire - FastFlux</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        :root {
            --bg-main: #07070a;
            --bg-glass: rgba(20, 20, 30, 0.65);
            --accent-1: #7c3aed;
            --accent-2: #a855f7;
            --accent-3: #6366f1;
            --text-primary: #f1f1f5;
            --text-secondary: #9ca3af;
            --border-glass: rgba(255, 255, 255, 0.08);
            --glow: rgba(124, 58, 237, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            animation: orbFloat 12s ease-in-out infinite;
        }

        .bg-orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-1) 0%, transparent 70%);
            top: -150px;
            left: -100px;
            animation-delay: 0s;
            animation-duration: 14s;
        }

        .bg-orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-3) 0%, transparent 70%);
            bottom: -120px;
            right: -80px;
            animation-delay: -4s;
            animation-duration: 16s;
        }

        .bg-orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-2) 0%, transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: -7s;
            animation-duration: 18s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(40px, 30px) scale(1.02); }
        }

        /* Grid pattern overlay */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Login card */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-glass);
            backdrop-filter: blur(30px) saturate(1.5);
            -webkit-backdrop-filter: blur(30px) saturate(1.5);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 48px 40px 40px;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(124, 58, 237, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */
        .logo-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            color: #fff;
            box-shadow: 0 8px 24px var(--glow);
            animation: logoPulse 3s ease-in-out infinite;
        }
        .logo-icon svg { width: 30px; height: 30px; }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 8px 24px var(--glow); }
            50% { box-shadow: 0 12px 40px rgba(124, 58, 237, 0.6); }
        }

        .logo-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 6px;
            font-weight: 400;
        }

        /* Error message */
        .error-banner {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shakeError 0.5s ease-in-out;
        }
        .error-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* Form */
        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            transition: opacity 0.3s;
            pointer-events: none;
            display: flex;
            align-items: center;
            color: var(--text-secondary);
        }
        .input-icon svg { width: 18px; height: 18px; }

        .form-input {
            width: 100%;
            padding: 16px 18px 16px 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: none;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .form-input:focus {
            border-color: var(--accent-1);
            background: rgba(124, 58, 237, 0.06);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }

        .form-input:focus + .input-icon,
        .form-input:focus ~ .input-icon {
            opacity: 1;
        }

        /* Show password toggle */
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            transition: color 0.3s;
            display: flex;
            align-items: center;
        }
        .toggle-password svg { width: 18px; height: 18px; }

        .toggle-password:hover {
            color: var(--text-primary);
        }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-3) 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px var(--glow);
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:active {
            transform: translateY(0px);
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .login-footer p {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .login-footer .lock-icon {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .login-footer .lock-icon svg { width: 14px; height: 14px; opacity: 0.7; }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: var(--accent-2);
            border-radius: 50%;
            opacity: 0;
            z-index: 2;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            20% { opacity: 0.6; }
            80% { opacity: 0.4; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 36px 28px 32px;
                border-radius: 20px;
            }
            .logo-icon {
                width: 52px;
                height: 52px;
                font-size: 24px;
                border-radius: 14px;
            }
            .logo-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background -->
    <div class="bg-canvas">
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
    </div>
    <div class="bg-grid"></div>

    <!-- Floating particles -->
    <script>
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (6 + Math.random() * 8) + 's';
            p.style.animationDelay = Math.random() * 8 + 's';
            p.style.width = (2 + Math.random() * 3) + 'px';
            p.style.height = p.style.width;
            document.body.appendChild(p);
        }
    </script>

    <!-- Login card -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon"><i data-feather="zap"></i></div>
                <div class="logo-title">FastFlux</div>
                <div class="logo-subtitle">Espace Partenaire</div>
            </div>

            
            <form action="api/partner_auth.php" method="POST" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Nom d'utilisateur</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-input" id="username" name="username" required autofocus placeholder="Entrez votre identifiant">
                        <span class="input-icon"><i data-feather="user"></i></span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mot de passe</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-input" id="password" name="password" required placeholder="••••••••">
                        <span class="input-icon"><i data-feather="lock"></i></span>
                        <button type="button" class="toggle-password" onclick="togglePass()" id="toggleBtn" aria-label="Afficher le mot de passe"><i data-feather="eye"></i></button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Se connecter →
                </button>
            </form>

            <div class="login-footer">
                <p class="lock-icon"><i data-feather="shield"></i> Accès réservé aux partenaires autorisés</p>
            </div>
        </div>
    </div>

    <script>
        feather.replace();

        function togglePass() {
            const input = document.getElementById('password');
            const btn = document.getElementById('toggleBtn');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.innerHTML = isHidden
                ? '<i data-feather="eye-off"></i>'
                : '<i data-feather="eye"></i>';
            feather.replace();
        }

        // Subtle input focus animations
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.input-wrapper').style.transform = 'scale(1.01)';
            });
            input.addEventListener('blur', () => {
                input.closest('.input-wrapper').style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
